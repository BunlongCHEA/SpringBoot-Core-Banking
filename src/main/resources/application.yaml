# =============================================================
# BASE configuration — committed to Git, contains NO secrets.
#
# Every secret is a ${ENV_VAR} placeholder WITHOUT a default, so a
# missing secret makes the app fail fast at startup instead of
# silently running with a weak fallback.
#
#   Local dev : put real values in application-local.yaml (git-ignored)
#               and run with SPRING_PROFILES_ACTIVE=local
#   UAT / PROD: values come from the Kubernetes Secret "cbs-env",
#               which Jenkins builds from the cbs-uat-env / cbs-prod-env
#               credential (see deploy/cbs.env.example)
#   Tests     : src/test/resources/application-test.yaml + Testcontainers
# =============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1
  shutdown: graceful            # finish in-flight requests on SIGTERM (K8s rollout)
  forward-headers-strategy: framework   # trust X-Forwarded-* from nginx (real client IP / https)
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: core-banking-system

  lifecycle:
    timeout-per-shutdown-phase: 30s   # must be < terminationGracePeriodSeconds (40s)

  threads:
    virtual:
      enabled: true   # Java 25 Virtual Threads

  # ── PostgreSQL ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CBS-HikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ── MongoDB ──────────────────────────────────────────────
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: false
      uuid-representation: standard

    # ── Redis ────────────────────────────────────────────────
    redis:
      url: ${REDIS_URI}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 200ms

# ── Logging ────────────────────────────────────────────────
# Profiles (uat / prod) override the levels. Never enable
# org.hibernate.orm.jdbc.bind=TRACE outside your laptop: it logs
# SQL parameter values (account numbers, names).
logging:
  level:
    com.bank.cbs: INFO
    org.springframework.data.mongodb.core: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/core-banking-system.log

# ── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true           # /actuator/health/liveness and /readiness for Kubernetes
  health:
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:true}
  info:
    env:
      enabled: true

info:
  app:
    name: Core Banking System
    version: '@project.version@'
    description: Production Core Banking Backend

# ── CBS Custom Configuration ───────────────────────────────
cbs:
  redis:
    ttl:
      session-seconds: 1800        # 30 min
      otp-seconds: 300             # 5 min
      balance-cache-seconds: 30    # 30 sec
      idempotency-seconds: 86400   # 24 hrs
      rate-limit-seconds: 60       # 1 min window
      lock-seconds: 10             # distributed lock
  transaction:
    max-daily-limit: 50000.00
    max-single-transfer: 10000.00
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: 3600     # SECONDS, not milliseconds
    cors:
      # comma-separated, e.g. https://cbs-uat.bunlong.uk,https://cbs.bunlong.uk
      allowed-origins: ${CBS_CORS_ORIGINS:http://localhost:3000}
  super-admin:
    username: superadmin
    email: superadmin@cbs.bank
    initial-password: ${CBS_SUPER_ADMIN_INITIAL_PASSWORD}   # min 15 chars

kyc:
  base-url: ${KYC_BASE_URL}
  api-key: ${KYC_API_KEY}
  mq:
    keys-json: '{"v1":"${KYC_MQ_KEY_V1}"}'
    request-signing-secret: ${CBS_HMAC_SECRET}

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:false}     # true once RabbitMQ is reachable from this environment
  host: ${RABBITMQ_HOST:rabbitmq}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:cbs_consumer}
  password: ${RABBITMQ_PASS:}
  virtual-host: ${RABBITMQ_VHOST:kyc_vhost}
  ssl:
    enabled: ${RABBITMQ_SSL_ENABLED:false}
    verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:false}
