server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: core-banking-system

  threads:
    virtual:
      enabled: true   # Java 25 Virtual Threads

  # ── PostgreSQL ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:core_banking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CBS-HikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ── MongoDB ──────────────────────────────────────────────
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://admin:07QmRa1RYrP3oq4@mongodb-service.production.svc.cluster.local:27017/core_banking_logs?authSource=admin}
      database: ${MONGO_DB:core_banking_logs}
      auto-index-creation: true
      uuid-representation: standard

    # ── Redis ────────────────────────────────────────────────
    # redis://default:ul6GAn92ARa8xPCgbmO4WynkcOPDRgfz@redis-16904.crce194.ap-seast-1-1.ec2.cloud.redislabs.com:16904/0
    redis:
      host: ${REDIS_HOST:redis-16904.crce194.ap-seast-1-1.ec2.cloud.redislabs.com}
      port: ${REDIS_PORT:16904}
      password: ${REDIS_PASSWORD:ul6GAn92ARa8xPCgbmO4WynkcOPDRgfz}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 200ms

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    com.bank.cbs: DEBUG
    org.springframework.data.mongodb.core: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/core-banking-system.log

# ── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Core Banking System
    version: 1.0.0
    description: Production Core Banking Backend

# ── CBS Custom Configuration ───────────────────────────────
cbs:
  redis:
    ttl:
      session-seconds: 1800        # 30 min
      otp-seconds: 300             # 5 min
      balance-cache-seconds: 30    # 30 sec
      idempotency-seconds: 86400   # 24 hrs
      rate-limit-seconds: 60       # 1 min window
      lock-seconds: 10             # distributed lock
  transaction:
    max-daily-limit: 50000.00
    max-single-transfer: 10000.00
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-256-bit-secret-in-production-env}
      expiration-seconds: 3600