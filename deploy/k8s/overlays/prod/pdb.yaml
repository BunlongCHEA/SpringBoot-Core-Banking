# Keep at least one pod of each running during node drains / K3s upgrades
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbs-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cbs-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbs-nginx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cbs-nginx
