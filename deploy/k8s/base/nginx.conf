# =============================================================
# nginx reverse proxy in front of cbs-backend (one per namespace).
#   Cloudflare (HTTPS) → cloudflared → Traefik :80 → THIS :8080 → cbs-backend:8080
# What nginx adds on top of Traefik:
#   - only /api/v1/* is reachable; actuator internals are hidden
#   - rate limiting (stricter on /auth/login against brute force)
#   - request size limit, timeouts, security headers, JSON access log
# Changing this file = commit + deploy; the pods restart automatically
# (kustomize configMapGenerator adds a content hash to the ConfigMap name).
# =============================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Writable dirs for a read-only root filesystem (non-root image)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/json;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # ---- Real client IP -------------------------------------------------
    # Only Traefik pods (K3s cluster CIDR) can reach this Service. Cloudflare
    # puts the visitor IP in CF-Connecting-IP and Traefik passes it through.
    set_real_ip_from 10.42.0.0/16;
    real_ip_header   CF-Connecting-IP;

    # Scheme the visitor used (Cloudflare terminates TLS → "https")
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ---- Logging (JSON to stdout → picked up by Alloy / Graylog) --------
    log_format json escape=json '{"time":"$time_iso8601","client":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_time":"$upstream_response_time","ua":"$http_user_agent",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout json;

    # ---- Rate limits (per real client IP) -------------------------------
    limit_req_zone $binary_remote_addr zone=cbs_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=cbs_api:10m   rate=20r/s;
    limit_req_status 429;

    # ---- Request limits / timeouts --------------------------------------
    client_max_body_size   10m;
    client_body_timeout    30s;
    client_header_timeout  30s;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    upstream cbs_backend {
        server cbs-backend:8080;     # Service in the same namespace
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Security headers on every response
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-Id $request_id always;

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # nginx's own probe (used by Kubernetes, never proxied)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Public health: in prod it only returns {"status":"UP"}
        location = /api/v1/actuator/health {
            proxy_pass http://cbs_backend;
        }

        # Everything else under actuator stays internal
        # (Prometheus scrapes cbs-backend:8080 directly inside the cluster)
        location ^~ /api/v1/actuator/ {
            return 404;
        }

        # Brute-force protection on login
        location = /api/v1/auth/login {
            limit_req zone=cbs_login burst=5 nodelay;
            proxy_pass http://cbs_backend;
        }

        location /api/v1/ {
            limit_req zone=cbs_api burst=50 nodelay;
            proxy_pass http://cbs_backend;
        }

        # Anything outside the API
        location / {
            return 404 '{"error":"not found"}';
        }
    }
}
