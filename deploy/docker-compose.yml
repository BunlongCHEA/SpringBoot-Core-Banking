# =============================================================
# /opt/cbs/docker-compose.yml  — same file on UAT and PROD servers
# -------------------------------------------------------------
#  IMAGE_NAME / IMAGE_TAG  come from /opt/cbs/.env  (written by deploy.sh)
#  App secrets             come from /opt/cbs/cbs.env (you create it, chmod 600)
#  PostgreSQL, Redis, MongoDB, RabbitMQ are EXTERNAL services — not in this file.
# =============================================================
services:
  cbs-backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: cbs-backend
    restart: unless-stopped
    env_file:
      - cbs.env
    ports:
      - "8080:8080"              # put Nginx / Cloudflare Tunnel in front for HTTPS
    volumes:
      - ./logs:/app/logs         # host folder must be owned by UID 10001
    stop_grace_period: 40s       # > server.shutdown graceful timeout (30s)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
